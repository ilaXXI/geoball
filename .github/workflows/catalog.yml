name: Catalogue CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Catalogue tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/catalog/requirements*.txt
      - run: python -m pip install -r services/catalog/requirements-dev.txt
      - run: python scripts/course.py test-catalog
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-tests
          path: reports/catalog/tests.xml
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Catalogue quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/catalog/requirements*.txt
      - run: python -m pip install -r services/catalog/requirements-dev.txt
      - run: python scripts/course.py lint-catalog
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-quality
          path: |
            reports/catalog/ruff.json
            reports/catalog/format.txt
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Catalogue Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: gabriel0langlois/geoball-catalog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t "$IMAGE:sha-$GITHUB_SHA" services/catalog
      - name: Publish on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username gabriel0langlois --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
