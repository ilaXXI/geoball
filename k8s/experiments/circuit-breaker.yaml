apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: geoball-catalog-limits
spec:
  host: geoball-catalog.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
        http2MaxRequests: 1
        maxRequestsPerConnection: 1
