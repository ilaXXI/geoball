apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: geoball-catalog
spec:
  hosts:
    - "*"
  gateways:
    - geoball-gateway
  http:
    - match:
        - uri:
            exact: /quizzes
        - uri:
            prefix: /quizzes/
      route:
        - destination:
            host: geoball-quiz
            port:
              number: 8000
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: geoball-catalog
            port:
              number: 8000
