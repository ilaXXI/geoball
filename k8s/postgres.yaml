apiVersion: v1
kind: ConfigMap
metadata:
  name: geoball-database
data:
  POSTGRES_HOST: geoball-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: geoball
  POSTGRES_USER: geoball
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoball-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoball-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geoball-postgres
  template:
    metadata:
      labels:
        app: geoball-postgres
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - configMapRef:
                name: geoball-database
            - secretRef:
                name: geoball-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geoball-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: geoball-postgres
spec:
  selector:
    app: geoball-postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
